<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/portfolio.css" />
    <link rel="stylesheet" href="styles/showcase.css" />
    <script src="scripts/portfolio.js" defer></script>
    <script src="scripts/showcase.js" defer></script>
    <title>Christina Bercasio | Projects</title>
  </head>

  <body>
    <main class="showcase" id="section-projects">
      <div class="showcase-shell">
        <header class="showcase-head">
          <div class="showcase-heading">
            <p class="showcase-kicker">World building / Environment art</p>
            <h1 class="showcase-title">The Kingdom of Rites</h1>
            <p class="showcase-intro">A medieval fantasy kingdom swallowed by a crimson eclipse. Level design, layout and VFX.</p>
          </div>
          <div class="showcase-controls" role="group" aria-label="Showcase view">
            <button type="button" data-mode="story" aria-pressed="true">Story</button>
            <button type="button" data-mode="mosaic" aria-pressed="false">Mosaic</button>
            <button type="button" class="showcase-autoplay" aria-label="Pause autoplay">&#x23F8;</button>
          </div>
        </header>
        <div class="showcase-progress" aria-hidden="true"><i></i></div>
        <section class="showcase-story" aria-label="Project story">
          <div class="showcase-story-page"></div>
          <div class="showcase-story-nav">
            <button type="button" class="showcase-arrow" data-story-step="-1" aria-label="Previous page">&#x2039;</button>
            <div class="showcase-dots" aria-label="Story pages"></div>
            <button type="button" class="showcase-arrow" data-story-step="1" aria-label="Next page">&#x203A;</button>
          </div>
        </section>
        <section class="showcase-mosaic" aria-label="The Kingdom of Rites gallery" hidden></section>
        <dialog class="showcase-lightbox" aria-label="The Kingdom of Rites gallery">
          <div class="showcase-lightbox-inner"></div>
        </dialog>
      </div>
    </main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="projects.html" class="is-active" aria-current="page">Projects</a>
      <a href="contact.html">Contact</a>
    </nav>
  </body>
</html>
